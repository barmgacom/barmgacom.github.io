            // Adjust Navbar direction dynamically
            document.getElementById('nav-bar').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

            // 2. Update toggle button UI
            const langBtn = document.getElementById('lang-toggle-btn');
            if (currentLang === 'ar') {
                langBtn.innerHTML = 'English <i class="bi bi-arrow-left"></i>';
            } else {
                langBtn.innerHTML = '<i class="bi bi-arrow-left"></i> العربية';
            }

            // 3. Update Meta & Document Title
            document.querySelector('head title').textContent = restaurantInfo.name;
            document.querySelector('meta[name="keywords"]').setAttribute('content', restaurantInfo.keywords);
            document.querySelector('meta[name="description"]').setAttribute('content', restaurantInfo.description);

            // 4. Update Static Text Elements
            document.getElementById('hero-welcome-text').textContent = restaurantInfo.heroWelcome;
            document.getElementById('hero-title-prefix').textContent = restaurantInfo.heroTitle;
            document.getElementById('menu-subtitle').textContent = restaurantInfo.menuSubtitle;
            document.getElementById('menu-title').textContent = restaurantInfo.menuTitle;
            document.getElementById('footer-rights').textContent = restaurantInfo.footerRights;

            // 5. Update Dynamic Restaurant Info
            document.getElementById('restaurant-name').textContent = restaurantInfo.name;
            document.querySelector('.welcomeclass .restoName').textContent = restaurantInfo.name;
            
            const descEl = document.getElementById('restaurant-description');
            if (restaurantInfo.description) {
                descEl.textContent = restaurantInfo.description;
                descEl.style.display = 'block';
            } else {
                descEl.style.display = 'none';
            }

            // Update Contact Info
            const elements = ['email', 'phone', 'address'];
            elements.forEach(type => {
                const span = document.getElementById(`${type}-info-span`);
                const div = document.getElementById(`${type}-info`);
                if (restaurantInfo[type]) {
                    span.textContent = restaurantInfo[type];
                    div.style.display = 'flex';
                } else {
                    div.style.display = 'none';
                }
            });

            document.getElementById('site-title-footer').textContent = restaurantInfo.name;
            document.getElementById('current-year').textContent = new Date().getFullYear();

            // 6. Re-render Menu Components
            generateHeroButtons();
            
            // Re-render menu content with full menu on language switch to be clean
            renderContent(allMenuData, 'menu-section', null);
        }

        document.getElementById('lang-toggle-btn').addEventListener('click', (e) => {
            e.preventDefault();
            const newLang = currentLang === 'ar' ? 'en' : 'ar';
            window.location.hash = newLang; // Keep track in URL
            setLanguage(newLang);
        });

        // ==========================================
        // 4. MENU LOGIC & RENDERERS
        // ==========================================
        function generateHeroButtons() {
            const container = document.getElementById('hero-category-buttons');
            container.innerHTML = ''; 

            const uniqueCategories = new Set();
            allMenuData.forEach(item => {
                if (item.category) uniqueCategories.add(item.category);
            });

            // Adjust animation direction based on language
            const animationClass = currentLang === 'ar' ? 'bounceInRight' : 'bounceInLeft';
            const marginClass = currentLang === 'ar' ? 'ms-2' : 'me-2';

            // Create dynamic Category Buttons 
            uniqueCategories.forEach(category => {
                const button = document.createElement('a');
                button.href = '#';
                
                button.className = `shadow btn btn-primary border-0 rounded-pill py-3 px-4 px-md-5 animated ${animationClass} custom-btn ${marginClass} mb-2 category-hero-btn`;
                button.style.minWidth = '150px';
                button.style.animationDuration = '0.4s';
                button.textContent = category; 
                button.onclick = (e) => {
                    e.preventDefault();
                    
                    // Mark as active
                    document.querySelectorAll('.category-hero-btn').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    renderContent(allMenuData, 'menu-section', category);
                    document.getElementById('menu-section').scrollIntoView({ behavior: 'smooth' });
                };
                container.appendChild(button);
            });
        }

        function resetMenu() {
            document.querySelectorAll('.category-hero-btn').forEach(btn => btn.classList.remove('active'));
            renderContent(allMenuData, 'menu-section', null);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        //(function(){if(window['\x6c\x6f\x63\x61\x74\x69\x6f\x6e']['\x68\x6f\x73\x74\x6e\x61\x6d\x65']!==window['\x61\x74\x6f\x62']('d2ViLmFzd2VxLmNvbQ==')){window['\x6c\x6f\x63\x61\x74\x69\x6f\x6e']['\x68\x72\x65\x66']='https://barmga.com';}})();

        function renderContent(itemsData, targetSectionId, filterCategory = null) {
            const tabList = document.querySelector(`#${targetSectionId} .nav.nav-pills`);
            const menuContentArea = document.querySelector(`#${targetSectionId} #menu-content-area`);

            tabList.innerHTML = ""; 
            menuContentArea.innerHTML = ""; 

            // Step 1: Filter by Category (Hero button click)
            let itemsToRender = itemsData;
            if (filterCategory) {
                itemsToRender = itemsData.filter(item => item.category === filterCategory);
                document.getElementById('menu-title').textContent = filterCategory; // Update title to reflect category
            } else {
                document.getElementById('menu-title').textContent = restaurantInfo.menuTitle;
            }

            // Step 2: Group by Subcategory
            const subcategoryMap = {};
            itemsToRender.forEach(item => {
                const subcategory = item.subcategory ? item.subcategory : (item.category ? item.category : "General");
                if (!subcategoryMap[subcategory]) subcategoryMap[subcategory] = [];
                subcategoryMap[subcategory].push(item);
            });

            const sortedSubcategoryNames = Object.keys(subcategoryMap);

            // Render Subcategory Tabs (Automatically flows RTL in Arabic because dir="ltr" was removed)
            sortedSubcategoryNames.forEach(subcategoryName => {
                const subcategoryHeaderId = `subcat-${targetSectionId}-${subcategoryName.replace(/\s+/g, '-').toLowerCase()}`;

                const li = document.createElement("li");
                
                // FIX: Check if there is only one subcategory to prevent the button from collapsing
                const mobileClass = sortedSubcategoryNames.length === 1 ? "nav-item p-1" : "nav-item p-1 col-6";
                li.className = window.innerWidth < 760 ? mobileClass : "nav-item p-2";
                
                li.innerHTML = `
                    <a class="w-100 justify-content-center d-flex py-2 px-2 border border-primary bg-white rounded-pill" style="white-space: nowrap;" href="#${subcategoryHeaderId}">
                        <span class="text-dark">${currentLang === 'en' ? capitalizeWords(subcategoryName) : subcategoryName}</span>
                    </a>
                `;
                li.querySelector('a').onclick = (e) => {
                    e.preventDefault();
                    document.getElementById(subcategoryHeaderId)?.scrollIntoView({ behavior: 'instant', block: 'start' });
                    document.querySelectorAll(`#${targetSectionId} .nav-pills a`).forEach(btn => btn.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                };
                tabList.appendChild(li);
            });

            // Render Subcategory Sections and Items
            sortedSubcategoryNames.forEach(subcategoryName => {
                const subcategoryHeaderId = `subcat-${targetSectionId}-${subcategoryName.replace(/\s+/g, '-').toLowerCase()}`;
                
                const subcategoryHeader = document.createElement("h3");
                subcategoryHeader.id = subcategoryHeaderId;
                subcategoryHeader.textContent = currentLang === 'en' ? capitalizeWords(subcategoryName) : subcategoryName; 
                menuContentArea.appendChild(subcategoryHeader);

                const row = document.createElement("div");
                row.className = "row g-4";

                subcategoryMap[subcategoryName].forEach(item => {
                    const name = currentLang === 'en' ? capitalizeWords(item.name || "") : (item.name || "");
                    const price = item.price || "";
                    const desc = item.description || "";
                    let calories = item.calories ? item.calories + (currentLang === 'en' ? " calories." : " سعرة.") : "";
                    const imagePath = item.image ? (item.image.startsWith('http') || item.image.includes('images/') ? item.image : `images/${item.image}`) : `images/default.png`;
                    const paddingClass = currentLang === 'ar' ? 'pe-4' : 'ps-4';

                    let descText = [desc, calories].filter(Boolean).join("<br>");

                    row.innerHTML += `
                        <div class="col-lg-6">
                            <div class="menu-item d-flex align-items-center">
                                <img class="flex-shrink-0 img-fluid rounded-circle" src="${imagePath}" onerror="this.onerror=null;this.src='images/default.png';" alt="${name}" style="height: 100px; width: 100px; object-fit: cover;">
                                <div class="w-100 d-flex flex-column text-start ${paddingClass}">
                                    <div class="d-flex justify-content-between border-bottom border-primary pb-2 mb-2">
                                        <h4>${name}</h4>
                                        <h4 class="text-primary">${price}</h4>
                                    </div>
                                    <p class="mb-0">${descText}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
                menuContentArea.appendChild(row);
            });

            if (sortedSubcategoryNames.length > 0) {
                tabList.querySelector('a')?.classList.add('active');
            }
        }

        // ==========================================
        // 5. SCROLL & INITIALIZATION
        // ==========================================
        function heightsec() {
            const homeSection = document.getElementById('home-section');
            return homeSection ? homeSection.offsetHeight : 300;
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Check hash in URL to set initial language
            if (window.location.hash === '#ar') {
                currentLang = 'ar';
            } else if (window.location.hash === '#en') {
                currentLang = 'en';
            } else {
                window.location.hash = currentLang;
            }

            // Initialize App
            setLanguage(currentLang);
            // On page load, immediately render the full menu
            renderContent(allMenuData, 'menu-section', null);

            // Hide spinner
            const spinner = document.getElementById('spinner');
            if (spinner) {
                setTimeout(() => {
                    spinner.classList.remove('show');
                    spinner.style.display = 'none';
                }, 500);
            }

            // Back to top button logic
            const backToTopButton = document.querySelector('.back-to-topx');
            window.addEventListener('scroll', () => {
                backToTopButton.style.display = window.scrollY > heightsec() ? 'flex' : 'none';
            });

            backToTopButton.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
        window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'IMG') {
      const img = e.target;
      if (!img.src.endsWith('images/default.png')) {
        img.src = 'images/default.png';
      }
    }
  }, true);
    </script>
    <script>
(function() {
  const WORKER_ENDPOINT = "https://tr.gmapydir.workers.dev/api/track";

  try {
    // 1. Get pathname and strip trailing slashes (e.g., "/campaign/promo123///" -> "/campaign/promo123")
    const cleanPath = window.location.pathname.replace(/\/+$/, "");

    // 2. Extract the last segment after the final slash
    // If the path was empty or just "/", paramId becomes "direct"
    const lastSegment = cleanPath.split("/").filter(Boolean).pop();
    const paramId = lastSegment ? decodeURIComponent(lastSegment) : "direct";

    // 3. Prepare payload
    const payload = JSON.stringify({
      param_id: paramId,
      full_url: window.location.href,
      referrer: document.referrer || "direct"
    });

    // 4. Send non-blocking beacon to Cloudflare Worker
    if (navigator.sendBeacon) {
      navigator.sendBeacon(WORKER_ENDPOINT, payload);
    } else {
      fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        keepalive: true
      });
    }
  } catch (err) {
    // Fail silently so the user experience is never interrupted
  }
})();
</script>
