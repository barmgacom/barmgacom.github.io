<head>
<meta charset="UTF-8">

<style>
  :root {
    --bg: #121511;
    --bg-raised: #2b2c21;
    --line: #403d36;
    --ink: #EEE8DA;
    --ink-dim: #b3b0a9;
    --brass: #C79A5C;
    --brass-dim: #7C6640;
    --sage: #948f7e;
    --tag-bg: rgba(126,148,132,0.12);
    --btn-bg: rgba(239, 239, 239, 0.1);
    --font-display-ar: 'Amiri', serif;
    --font-body-ar: 'Cairo', sans-serif;
    --font-display-en: 'Fraunces', serif;
    --font-body-en: 'Work Sans', sans-serif;
  }
  button{background-color: var(--btn-bg) !important; color: var(--ink) !important;}
  /* Refined Editorial Light Theme */
  html[data-theme="light"] {
    --bg: #F4EFE6;
    --bg-raised: #EAE3D5;
    --line: #D7CBB7;
    --ink: #1C231F;
    --ink-dim: #5C675F;
    --brass: #9E7432;
    --brass-dim: #6E5224;
    --sage: #476350;
    --tag-bg: rgba(71, 99, 80, 0.08);
    --btn-bg: rgba(239, 239, 239, 0.515);
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body-ar);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  html[lang="en"] body {
    font-family: var(--font-body-en);
  }

  button, input {
    font-family: inherit;
  }

  html[dir="rtl"] button, 
  html[dir="rtl"] input {
    font-family: var(--font-body-ar) !important;
  }

  ::selection { background: var(--brass); color: #1B2420; }

  /* ---------- Top Bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.6rem 6vw 0;
    margin-bottom: 1.2rem;
  }

  .brand-logo-wrap {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    padding: 2.5px;
    background: linear-gradient(135deg, var(--brass), var(--sage));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    transition: transform 0.2s ease;
  }

  .brand-logo-wrap:hover {
    transform: scale(1.03);
  }

  .brand-logo-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: var(--bg-raised);
    display: block;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  /* Theme Button */
  .theme-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    padding: 0;
    line-height: 0;
    font-size: 0;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--brass);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .theme-btn:hover {
    border-color: var(--brass);
    color: var(--ink);
    background: var(--bg-raised);
    transform: translateY(-1px);
  }

  #theme-icon-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
  }

  .theme-btn svg {
    display: block;
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.3s ease;
  }

  .theme-btn:hover svg {
    transform: rotate(15deg);
  }

  .lang-toggle {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 999px;
    padding: 0.5rem 1.3rem;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--font-body-ar) !important;
  }

  .lang-toggle:hover {
    background: var(--brass);
    border-color: var(--brass);
    color: #1B2420;
    transform: translateY(-1px);
  }

  /* ---------- Header ---------- */
  header {
    padding: 2.8rem 6vw 2.5rem;
    border-bottom: 1px solid var(--line);
    position: relative;
  }

  .kicker {
    font-size: 0.95rem;
    color: var(--sage);
    letter-spacing: 0.02em;
    margin: 0 0 1rem;
    font-weight: 600;
  }

  h1 {
    font-family: var(--font-display-ar);
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    line-height: 1.1;
    margin: 0 0 1rem;
    max-width: 18ch;
  }

  html[lang="en"] h1 {
    font-family: var(--font-display-en);
    font-weight: 500;
    line-height: 1.02;
    max-width: 14ch;
  }

  h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--brass);
  }

  header p.lede {
    max-width: 48ch;
    color: var(--ink-dim);
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0;
  }

  /* ---------- Controls (Static, Non-Sticky) ---------- */
  .controls {
    position: static;
    background: transparent;
    border-bottom: 1px solid var(--line);
    padding: 1.2rem 6vw;
    display: flex;
    gap: 0.8rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .cat-tabs {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .tab {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line);
    padding: 0.45rem 1.1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }

  .tab:hover {
    color: var(--ink);
    border-color: var(--sage);
  }

  .tab.active {
    color: #1B2420;
    background: var(--brass);
    border-color: var(--brass);
  }

  .search-wrap {
    margin-inline-start: auto;
    position: relative;
  }

  .search-wrap input {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 0.92rem;
    padding: 0.5rem 1rem 0.5rem 2.2rem;
    border-radius: 999px;
    width: 15rem;
    outline: none;
    transition: border-color 0.2s ease;
  }

  html[dir="rtl"] .search-wrap input {
    padding: 0.5rem 2.2rem 0.5rem 1rem;
  }

  .search-wrap input:focus { border-color: var(--brass); }
  .search-wrap input::placeholder { color: var(--ink-dim); }

  .search-wrap svg {
    position: absolute;
    inset-inline-start: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: var(--ink-dim);
  }

  /* ---------- Sections ---------- */
  main { padding: 1rem 6vw 6rem; }

  section.category {
    padding-top: 3.4rem;
  }

  .category-head {
    display: flex;
    align-items: baseline;
    gap: 1.2rem;
    margin-bottom: 1.6rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.9rem;
  }

  .category-head h2 {
    font-family: var(--font-display-ar);
    font-weight: 700;
    font-size: 1.9rem;
    margin: 0;
    color: var(--ink);
  }

  html[lang="en"] .category-head h2 {
    font-family: var(--font-display-en);
    font-weight: 500;
  }

  .dish-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    column-gap: 3.5rem;
  }

  @media (max-width: 780px) {
    .dish-grid { grid-template-columns: 1fr; }
    .search-wrap { width: 100%; margin-top: 0.5rem; margin-inline-start: 0; }
    .search-wrap input { width: 100%; }
  }

  .dish {
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 1rem;
    align-content: start;
  }

  .dish-name-row {
    display: flex;
    align-items: baseline;
    gap: 0.55rem;
    flex-wrap: wrap;
  }

  .dish-name {
    font-family: var(--font-display-ar);
    font-weight: 700;
    font-size: 1.22rem;
    margin: 0;
    color: var(--ink);
  }

  html[lang="en"] .dish-name {
    font-family: var(--font-display-en);
    font-weight: 500;
    font-size: 1.18rem;
  }

  .badge {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--brass);
    border: 1px solid var(--brass-dim);
    padding: 0.12rem 0.5rem;
    border-radius: 999px;
    line-height: 1.5;
    white-space: nowrap;
  }

  .price {
    font-family: var(--font-display-ar);
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--brass);
    white-space: nowrap;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  html[lang="en"] .price {
    font-family: var(--font-display-en);
    font-weight: 500;
    font-size: 1.18rem;
  }

  .price span {
    font-size: 0.75rem;
    color: var(--brass-dim);
    font-family: var(--font-body-ar);
  }

  html[lang="en"] .price span {
    font-family: var(--font-body-en);
  }

  .dish-desc {
    grid-column: 1 / -1;
    color: var(--ink-dim);
    font-size: 0.94rem;
    line-height: 1.6;
    margin: 0.5rem 0 0.7rem;
    max-width: 46ch;
  }

  .dish-meta {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .ingredients {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    max-width: 36ch;
  }

  .ingredients span {
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--sage);
    background: var(--tag-bg);
    padding: 0.18rem 0.55rem;
    border-radius: 4px;
  }

  .calories {
    font-size: 0.8rem;
    color: var(--ink-dim);
    white-space: nowrap;
    font-weight: 500;
  }

  .empty-state {
    text-align: center;
    padding: 5rem 1rem;
    color: var(--ink-dim);
    font-family: var(--font-display-ar);
    font-size: 1.3rem;
    display: none;
  }

  html[lang="en"] .empty-state {
    font-family: var(--font-display-en);
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 2.4rem 6vw;
    color: var(--ink-dim);
    font-size: 0.88rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }

    height: 2px;
    background: linear-gradient(

    opacity: 0.5;
  }

  .dish {
    position: relative;
    transition: border-color 0.25s ease, transform 0.2s ease;
  }

  .dish:hover {
    border-bottom-color: var(--brass-dim);
  }

  .category-head h2::before {
    content: "◆";
    font-size: 0.75rem;
    color: var(--brass);

  }

  .controls {
    background: linear-gradient(
      180deg, 
      rgba(33, 44, 39, 0.4) 0%,

    );
  }

  html[data-theme="light"] .controls {
    background: linear-gradient(
      180deg, 
      rgba(234, 227, 213, 0.45) 0%, 
      transparent 100%
    );
  }
</style>
</head>

        { category: "Sweets", name: "Molten Lava Cake", price: "36", description: "Warm dark chocolate cake with a molten center, dusted with raw cocoa powder.", ingredients: ["Dark Chocolate", "Cocoa Powder", "Eggs", "Ice Cream"], calories: 560, badge: "Molten" },
        { category: "Sweets", name: "Salted Caramel Date Cake", price: "34", description: "Warm date cake served with rich salted caramel sauce and vanilla bean ice cream.", ingredients: ["Premium Dates", "Salted Caramel", "Vanilla Ice Cream"], calories: 490, badge: "Warm" },
        { category: "Sweets", name: "Roasted Pistachio Cheesecake", price: "39", description: "Crunchy biscuit crust topped with silky cream cheese and pure pistachio butter.", ingredients: ["Cream Cheese", "Roasted Pistachio", "Digestive Biscuit"], calories: 520, badge: "" }

    },
    info: {
      ar: {
        kicker: "قائمة موسمية مختارة",
        title: "مطعم النخيل",
        heroTitle: "أطباق متقنة <span style=\"color: var(--brass);\">تحضّر بشغف</span>",
        desc: "عشرون طبقاً عبر خمس قوائم مميزة، كل طبق يُحضّر طازجاً عند الطلب بأجود المكونات الطبيعية.",
        allLabel: "الكل",
        currency: "ريال",
        calSuffix: "سعرة",
        searchPlaceholder: "ابحث عن طبق أو مكوّن...",
        emptyMessage: "لم نجد أي طبق يطابق بحثك.",
        address: "طريق الملك عبدالعزيز، حي الملقا، الرياض",
        phone: "+966 11 456 7890"
      },
      en: {
        kicker: "Seasonal menu",
        title: "Al-Nakheel Restaurant",
        heroTitle: "Hearty Food <span style=\"color: var(--brass);\">Cooked With Passion</span>",
        desc: "Twenty dishes, five courses, one kitchen. Everything below is made to order with premium natural ingredients.",
        allLabel: "All",
        currency: "SAR",
        calSuffix: "kcal",
        searchPlaceholder: "Search a dish or ingredient...",
        emptyMessage: "Nothing on the menu matches that.",
        address: "King Abdulaziz Road, Al Malqa District, Riyadh",
        phone: "+966 11 456 7890"
      }
    }
  };

  const main = document.getElementById('main');
  const emptyState = document.getElementById('empty');
  const catTabs = document.getElementById('catTabs');
  const searchInput = document.getElementById('search');
  const langToggleBtn = document.getElementById('langToggle');
  const themeToggleBtn = document.getElementById('themeToggle');

  let currentLang = 'ar';
  let currentTheme = 'dark';
  let activeCat = 'all';
  let query = '';

  function parseHash() {
    const hash = window.location.hash.toLowerCase();
    if (hash === '#en-lt') { currentLang = 'en'; currentTheme = 'light'; }
    else if (hash === '#en') { currentLang = 'en'; currentTheme = 'dark'; }
    else if (hash === '#ar-lt') { currentLang = 'ar'; currentTheme = 'light'; }
    else { currentLang = 'ar'; currentTheme = 'dark'; }
  }

  function updateHash() {
    const suffix = currentTheme === 'light' ? '-lt' : '';
    window.location.hash = `${currentLang}${suffix}`;
  }

  function applyTheme() {
    const root = document.getElementById('html-root');
    root.setAttribute('data-theme', currentTheme);

    const iconSlot = document.getElementById('theme-icon-slot');
    if (currentTheme === 'light') {
      iconSlot.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      `;
    } else {
      iconSlot.innerHTML = `
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      `;
    }
  }

  function renderTabs() {
    const info = appData.info[currentLang];
    const items = appData.menu[currentLang] || [];
    const uniqueCategories = [...new Set(items.map(it => it.category))].filter(Boolean);

    catTabs.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = `tab ${activeCat === 'all' ? 'active' : ''}`;
    allBtn.textContent = info.allLabel;
    allBtn.addEventListener('click', () => {
      activeCat = 'all';
      renderTabs();
      renderMenu();
    });
    catTabs.appendChild(allBtn);

    uniqueCategories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = `tab ${activeCat === cat ? 'active' : ''}`;
      btn.textContent = cat;
      btn.addEventListener('click', () => {
        activeCat = cat;
        renderTabs();
        renderMenu();
      });
      catTabs.appendChild(btn);
    });
  }

  function renderMenu() {
    main.innerHTML = '';
    const info = appData.info[currentLang];
    const items = appData.menu[currentLang] || [];
    const uniqueCategories = [...new Set(items.map(it => it.category))].filter(Boolean);
    let hasVisibleItems = false;

    uniqueCategories.forEach(cat => {
      if (activeCat !== 'all' && activeCat !== cat) return;

      const catItems = items.filter(it => {
        if (it.category !== cat) return false;
        if (!query) return true;
        const ingredientsStr = Array.isArray(it.ingredients) ? it.ingredients.join(' ') : (it.ingredients || '');
        const hay = (it.name + ' ' + (it.description || '') + ' ' + ingredientsStr).toLowerCase();
        return hay.includes(query);
      });

      if (catItems.length === 0) return;
      hasVisibleItems = true;

      const section = document.createElement('section');
      section.className = 'category';

      section.innerHTML = `
        <div class="category-head">
          <h2>${cat}</h2>
        </div>
        <div class="dish-grid"></div>
      `;

      const grid = section.querySelector('.dish-grid');
catItems.forEach(it => {
        const dish = document.createElement('article');
        dish.className = 'dish';

        const rawIngredients = Array.isArray(it.ingredients)
          ? it.ingredients.join(',')
          : (typeof it.ingredients === 'string' ? it.ingredients : '');

        const ingredientsArr = rawIngredients
          .split(/[,،]+/)
          .map(s => s.trim())
          .filter(Boolean);
        const descMarkup = (it.description && it.description.trim()) 
          ? `<p class="dish-desc">${it.description.trim()}</p>` 
          : '';

        const hasCalories = it.calories !== undefined && it.calories !== null && it.calories !== '';
        const caloriesMarkup = hasCalories 
          ? `<span class="calories">${it.calories} ${info.calSuffix || ''}</span>` 
          : '';

        const ingredientsMarkup = ingredientsArr.length > 0 
          ? `<div class="ingredients">${ingredientsArr.map(ing => `<span>${ing}</span>`).join('')}</div>` 
          : '';

        const showMetaRow = ingredientsArr.length > 0 || hasCalories;

        dish.innerHTML = `
          <div class="dish-name-row">
            <h3 class="dish-name">${it.name || ''}</h3>
            ${(it.badge && it.badge.trim()) ? `<span class="badge">${it.badge.trim()}</span>` : ''}
          </div>
          <div class="price">${it.price || ''} <span>${info.currency || ''}</span></div>
          ${descMarkup}
          ${showMetaRow ? `
          <div class="dish-meta">
            ${ingredientsMarkup}
            ${caloriesMarkup}
          </div>` : ''}
        `;
        grid.appendChild(dish);
      });
      main.appendChild(section);
    });

    emptyState.style.display = hasVisibleItems ? 'none' : 'block';
  }

  function applyLanguage() {
    const info = appData.info[currentLang];
    const root = document.getElementById('html-root');

    root.setAttribute('lang', currentLang);
    root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
    document.title = info.title;

    document.getElementById('kicker').textContent = info.kicker;
    document.getElementById('heroTitle').innerHTML = info.heroTitle;
    document.getElementById('heroDesc').textContent = info.desc;
    document.getElementById('footerAddress').textContent = info.address;
    document.getElementById('footerPhone').textContent = info.phone;
    emptyState.textContent = info.emptyMessage;

    searchInput.placeholder = info.searchPlaceholder;
    langToggleBtn.textContent = currentLang === 'ar' ? 'English' : 'العربية';

    activeCat = 'all';
    query = '';
    searchInput.value = '';

    renderTabs();
    renderMenu();
  }

  themeToggleBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    updateHash();
    applyTheme();
  });

  langToggleBtn.addEventListener('click', () => {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    updateHash();
    applyTheme();
    applyLanguage();
  });

  searchInput.addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    renderMenu();
  });

  window.addEventListener('hashchange', () => {
    parseHash();
    applyTheme();
    applyLanguage();
  });

  document.addEventListener('DOMContentLoaded', () => {
    parseHash();
    updateHash();
    applyTheme();
    applyLanguage();
  });
</script>
