    <script>
(function() {
  // 1. Resolve User ID from URL (e.g. /1234/ or ?id=1234)
  function resolveUserId() {
    const url = new URL(window.location.href);
    const idParam = url.searchParams.get('id');
    if (idParam) return idParam.replace(/[^0-9]/g, '');

    const parts = url.pathname.split('/').filter(Boolean);
    for (const part of parts) {
      if (/^\d{4,10}$/.test(part)) return part;
    }
    return null;
  }

  const userId = resolveUserId();
  if (!userId) return; // Fail open if no valid member ID format found

  // 2. Derive base host path to read /expiry/{userId}.json
  // Ensures compatibility whether loaded from root domain or user folder
  const expiryFileUrl = `expiry/${userId}.json?nocache=${Date.now()}`;
  const redirectTarget = "dashboard?plans=true";

  fetch(expiryFileUrl, { cache: "no-store" })
    .then(res => {
      if (!res.ok) throw new Error("Expiry file not found or inaccessible");
      return res.json();
    })
    .then(data => {
      if (!data || !data.expires) return;

      const expiryDate = new Date(data.expires);
      if (isNaN(expiryDate.getTime())) return;

      // 3. Add 7-day grace period (7 * 24 * 60 * 60 * 1000 ms)
      const gracePeriodEnd = new Date(expiryDate.getTime() + (7 * 24 * 60 * 60 * 1000));
      // Compare against end-of-day for the grace threshold
      gracePeriodEnd.setHours(23, 59, 59, 999);

      const now = new Date();
      if (now > gracePeriodEnd) {
        // Exceeded grace period -> Redirect to dashboard
        window.location.replace(redirectTarget);
      }
    })
    .catch(() => {
      // Graceful fail-open: On network error or 404, show menu normally
    });
})();
</script>

                    name: "مطعم <em>النخيل</em>",
                    description: "تراث طهي أصيل يرتقي إلى الكمال المعاصر. اختبر النكهات النجدية التقليدية الفاخرة بأسلوب عصري فريد.",
                    address: "طريق الملك عبدالعزيز، حي الملقا، الرياض",
                    phone: "+966 11 456 7890",
                    email: "info@alnakheel.sa",
                    hours1: "السبت - الخميس: 1:00 ظهراً - 1:00 صباحاً",
                    hours2: "الجمعة: 4:00 عصراً - 2:00 صباحاً"
                },
                en: {
                    name: "Al-Nakheel <em>Restaurant</em>",
                    description: "An authentic culinary heritage elevated to modern perfection. Experience elite traditional Najdi flavors combined with contemporary style.",
                    address: "King Abdulaziz Road, Al Malqa District, Riyadh",
                    phone: "+966 11 456 7890",
                    email: "info@alnakheel.sa",
                    hours1: "Sat - Thu: 1:00 PM - 1:00 AM",
                    hours2: "Friday: 4:00 PM - 2:00 AM"
                },
                doem: true
            }
        };

        const UI_TEXT = {
            ar: { 
                allFilterLabel: "القائمة الكاملة", 
                locTitle: "موقعنا", 
                resTitle: "الحجوزات", 
                hoursTitle: "ساعات العمل",
                currency: "ريال"
            },
            en: { 
                allFilterLabel: "Full Menu", 
                locTitle: "Our Location", 
                resTitle: "Reservations", 
                hoursTitle: "Restaurant Hours",
                currency: "SAR"
            }
        };

        function renderInterface() {
            const currentData = appData.info[currentLang];
            const ui = UI_TEXT[currentLang];
            
            document.getElementById('html-root').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('html-root').setAttribute('lang', currentLang);
            document.getElementById('lang-toggle').innerText = currentLang === 'en' ? 'العربية' : 'English';
const stripHtml = (html) => (html || '').replace(/<[^>]*>?/gm, '').trim();
const cleanTitleName = stripHtml(currentData.name);
document.title = `${cleanTitleName} — ${currentLang === 'ar' ? 'قائمة الطعام' : 'Menu'}`;
            document.getElementById('hero-title').innerHTML = currentData.name;
            document.getElementById('hero-desc').textContent = currentData.description;
            
            document.getElementById('footer-loc-title').innerText = ui.locTitle;
            document.getElementById('footer-loc-1').innerText = currentData.address;
            
            document.getElementById('footer-res-title').innerText = ui.resTitle;
            document.getElementById('footer-res-1').innerText = currentData.email;
            
            const phoneField = document.getElementById('footer-res-2');
            phoneField.innerText = currentData.phone;
            phoneField.style.direction = 'ltr';
            
            document.getElementById('footer-hours-title').innerText = ui.hoursTitle;
            document.getElementById('footer-hours-1').innerText = currentData.hours1 || "";
            document.getElementById('footer-hours-2').innerText = currentData.hours2 || "";

            const filtersContainer = document.getElementById('nav-filters');
            filtersContainer.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.setAttribute('data-filter', 'all');
            allBtn.innerText = ui.allFilterLabel;
            filtersContainer.appendChild(allBtn);

            const uniqueCats = [...new Set(appData.menu[currentLang].map(item => item.category))].filter(Boolean);
            uniqueCats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.setAttribute('data-filter', cat);
                btn.innerText = cat;
                filtersContainer.appendChild(btn);
            });

            generateMenuHTML(uniqueCats);
            initFilterControls();
        }

        function generateMenuHTML(uniqueCats) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const items = appData.menu[currentLang];
            const localizedCurrency = UI_TEXT[currentLang].currency;

            uniqueCats.forEach(catId => {
                const heading = document.createElement('h2');
                heading.className = 'section-title';
                heading.id = `section-${catId}`; 
                heading.setAttribute('data-category', catId);
                heading.innerHTML = catId;
                container.appendChild(heading);

                const filteredItems = items.filter(item => item.category === catId);
                filteredItems.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'menu-row';
                    row.setAttribute('data-category', catId);

                    const badgeHTML = item.badge ? `<span class="badge">${item.badge}</span>` : '';
                    
                    let imgSrc = 'images/default.png';
                    let originalFilename = '';

                    if (item.image) {
                        const cleanFilename = item.image.replace('images/', ''); 
                        if (item.image.startsWith('http') || item.image.startsWith('data:')) {
                            imgSrc = item.image;
                            originalFilename = cleanFilename.split('/').pop(); 
                        } else {
                            imgSrc = `images/${cleanFilename}`;
                            originalFilename = cleanFilename;
                        }
                    }

                    const fallbackSrc = originalFilename ? `images/${originalFilename}` : `images/default.png`;

                    row.innerHTML = `
                        <div class="menu-image-wrapper">
                            <img src="${imgSrc}" onerror="if(this.src !== '${fallbackSrc}') { this.src='${fallbackSrc}'; } else { this.src='images/default.png'; }" alt="${item.name}" class="menu-image">
                        </div>
                        <div class="menu-content">
                            <div class="menu-header-flex">
                                <div class="title-wrapper">
                                    <h3 class="menu-title">${item.name}</h3>
                                    ${badgeHTML}
                                </div>
                                <span class="menu-price">${item.price} ${localizedCurrency}</span>
                            </div>
                            <p class="menu-desc">${item.description}</p>
                        </div>
                    `;
                    container.appendChild(row);
                });
            });
        }

        function initFilterControls() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    const filterValue = button.getAttribute('data-filter');
                    const targetElements = document.querySelectorAll('.menu-row, .section-title');

                    targetElements.forEach(el => {
                        const rowCategory = el.getAttribute('data-category');
                        if (filterValue === 'all' || filterValue === rowCategory) {
                            el.classList.remove('hidden');
                            el.style.animation = 'none';
                            el.offsetHeight; 
                            el.style.animation = 'slideUp 0.5s ease forwards';
                        } else {
                            el.classList.add('hidden');
                        }
                    });

                    if (filterValue !== 'all') {
                        const targetHeader = document.getElementById(`section-${filterValue}`);
                        if (targetHeader) setTimeout(() => { targetHeader.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); 
                    }
                });
            });
        }

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            window.location.hash = currentLang;
            renderInterface();
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash === '#en') currentLang = 'en';
            else if (window.location.hash === '#ar') currentLang = 'ar';
            else {
                currentLang = 'ar';
                window.location.hash = 'ar';
            }
            
            renderInterface();
        });
         window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'IMG') {
      const img = e.target;
      if (!img.src.endsWith('images/default.png')) {
        img.src = 'images/default.png';
      }
    }
  }, true);
    </script>
        <script>
(function() {
  const WORKER_ENDPOINT = "https://tr.gmapydir.workers.dev/api/track";

  try {
    // 1. Get pathname and strip trailing slashes (e.g., "/campaign/promo123///" -> "/campaign/promo123")
    const cleanPath = window.location.pathname.replace(/\/+$/, "");

    // 2. Extract the last segment after the final slash
    // If the path was empty or just "/", paramId becomes "direct"
    const lastSegment = cleanPath.split("/").filter(Boolean).pop();
    const paramId = lastSegment ? decodeURIComponent(lastSegment) : "direct";

    // 3. Prepare payload
    const payload = JSON.stringify({
      param_id: paramId,
      full_url: window.location.href,
      referrer: document.referrer || "direct"
    });

    // 4. Send non-blocking beacon to Cloudflare Worker
    if (navigator.sendBeacon) {
      navigator.sendBeacon(WORKER_ENDPOINT, payload);
    } else {
      fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        keepalive: true
      });
    }
  } catch (err) {
    // Fail silently so the user experience is never interrupted
  }
})();
</script>
