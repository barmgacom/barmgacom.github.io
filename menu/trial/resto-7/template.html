<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم النخيل — قائمة الطعام الفاخرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <style>
        :root {
            --bg-body: #0d0f12;
            --bg-card: rgba(26, 31, 44, 0.75);
            --bg-card-hover: rgba(35, 42, 59, 0.9);
            --accent-gold: #e5a93c;
            --accent-gold-light: #fcd34d;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Refined Warm Luxury Light Theme */
        html[data-theme="light"] {
            --bg-body: #f4eee5;
            --bg-card: rgba(255, 252, 247, 0.88);
            --bg-card-hover: rgba(255, 255, 255, 0.98);
            --accent-gold: #9e6f1f;
            --accent-gold-light: #825a16;
            --text-primary: #231b14;
            --text-secondary: #65584d;
            --text-muted: #8c7d70;
            --border-color: rgba(142, 108, 48, 0.16);
            --tag-bg: rgba(158, 111, 31, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 20px 20px 80px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(229, 169, 60, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.04) 0%, transparent 40%);
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        html[data-theme="light"] body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(158, 111, 31, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(90, 31, 30, 0.05) 0%, transparent 40%);
        }

        html[dir="rtl"] body {
            font-family: 'Cairo', sans-serif;
        }

        button, input {
            font-family: inherit;
        }

        html[dir="rtl"] button {
            font-family: 'Cairo', sans-serif !important;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        /* Top Bar with Border Underneath & Sibling Controls */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #fcd34d 0%, #e5a93c 50%, #926315 100%);
            box-shadow: 0 4px 15px rgba(229, 169, 60, 0.35), inset 0 0 4px rgba(0, 0, 0, 0.4);
            transition: var(--transition);
        }

        .logo-box:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(229, 169, 60, 0.5);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            max-height: unset;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background-color: #1a1f2c;
            border: 1.5px solid #0d0f12;
        }

        html[data-theme="light"] .logo-box {
            box-shadow: 0 4px 15px rgba(158, 111, 31, 0.25);
            background: linear-gradient(135deg, #e6cc77 0%, #d4a44a 50%, #ab7d33 100%);
        }

        html[data-theme="light"] .logo-box img {
            background-color: #ede2d3;
            border-color: #f4eee5;
        }

        .top-bar-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Minimalist Icon-Only Theme Button */
        .theme-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            padding: 0;
            line-height: 0;
            font-size: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            cursor: pointer;
            margin-bottom: 0;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        .theme-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: scale(1.05);
        }

        html[data-theme="light"] .theme-btn {
            background: rgba(255, 253, 250, 0.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        #theme-icon-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 0;
        }

        .theme-btn svg {
            display: block;
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Cairo', 'Outfit', sans-serif !important;
        }

        .lang-btn:hover {
            background: var(--accent-gold);
            color: #0d0f12;
        }

        html[data-theme="light"] .lang-btn {
            background: rgba(255, 253, 250, 0.8);
            border-color: var(--border-color);
        }

        html[data-theme="light"] .lang-btn:hover {
            background: #9e6f1f;
            color: #fffaf0;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header .top-badge {
            display: inline-block;
            background: rgba(229, 169, 60, 0.15);
            color: var(--accent-gold);
            border: 1px solid rgba(229, 169, 60, 0.3);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        html[data-theme="light"] .top-badge {
            background: rgba(158, 111, 31, 0.1);
            color: #825a16;
            border-color: rgba(158, 111, 31, 0.28);
        }

        header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 40%, var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        html[data-theme="light"] header h1 {
            background: linear-gradient(135deg, #231b14 45%, #9e6f1f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Category Tabs (Non-sticky) */
        .categories-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
            position: static;
            z-index: 10;
            padding: 8px;
            background: rgba(13, 15, 18, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 1px solid var(--border-color);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        html[data-theme="light"] .categories-nav {
            background: rgba(244, 238, 229, 0.92);
            border-color: rgba(142, 108, 48, 0.22);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .cat-btn {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 700;
            padding: 9px 22px;
            border-radius: 40px;
            cursor: pointer;
            transition: var(--transition);
        }

        .cat-btn:hover {
            color: var(--text-primary);
        }

        .cat-btn.active {
            background: var(--accent-gold);
            color: #0d0f12;
            box-shadow: 0 4px 18px rgba(229, 169, 60, 0.35);
        }

        html[data-theme="light"] .cat-btn.active {
            background: #9e6f1f;
            color: #fffaf0;
            box-shadow: 0 4px 18px rgba(158, 111, 31, 0.3);
        }

        /* Section Title in 'All' View */
        .category-section-title {
            grid-column: 1 / -1;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin: 20px 0 5px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 22px;
            background: var(--accent-gold);
            border-radius: 4px;
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 22px;
        }

        /* Card Layout */
        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
            backdrop-filter: blur(8px);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: rgba(229, 169, 60, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        html[data-theme="light"] .menu-card {
            box-shadow: 0 4px 20px rgba(70, 50, 30, 0.06);
        }

        html[data-theme="light"] .menu-card:hover {
            box-shadow: 0 12px 28px rgba(70, 50, 30, 0.12);
        }

        /* Circular Image Wrapper */
        .card-image-wrapper {
            position: relative;
            flex-shrink: 0;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, rgba(229, 169, 60, 0.6), rgba(255, 255, 255, 0.05));
        }

        .card-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1e2433;
            display: block;
        }

        /* 1-Word Feature Badge Over the Image */
        .card-badge {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #e5a93c, #f59e0b);
            color: #0d0f12;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            border: 1.5px solid #0d0f12;
        }

        html[data-theme="light"] .card-badge {
            background: linear-gradient(135deg, #9e6f1f, #c48c2c);
            color: #fffaf0;
            border-color: #fffcf7;
        }

        /* Content Section */
        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .card-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-gold-light);
            white-space: nowrap;
            display: flex;
            align-items: baseline;
            gap: 3px;
        }

        .card-price span {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.88rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .ingredients-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 12px;
        }

        .ing-tag {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            font-size: 0.74rem;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
        }

        html[data-theme="light"] .ing-tag {
            background: rgba(70, 50, 30, 0.05);
            color: #4a3e35;
            border: 1px solid rgba(70, 50, 30, 0.08);
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: auto;
        }

        .calories {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-card {
            animation: fadeIn 0.35s ease forwards;
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
            .categories-nav { width: 100%; border-radius: 20px; }
            .cat-btn { padding: 8px 12px; font-size: 0.85rem; flex: 1 1 calc(33.333% - 8px); }
        }
    </style>
</head>

        function parseHash() {
            const hash = window.location.hash.toLowerCase();
            if (hash === '#en-lt') { currentLang = 'en'; currentTheme = 'light'; }
            else if (hash === '#en') { currentLang = 'en'; currentTheme = 'dark'; }
            else if (hash === '#ar-lt') { currentLang = 'ar'; currentTheme = 'light'; }
            else { currentLang = 'ar'; currentTheme = 'dark'; }
        }

        function updateHash() {
            const suffix = currentTheme === 'light' ? '-lt' : '';
            window.location.hash = `${currentLang}${suffix}`;
        }

        function applyTheme() {
            const root = document.getElementById('html-root');
            root.setAttribute('data-theme', currentTheme);

            const iconSlot = document.getElementById('theme-icon-slot');

            if (currentTheme === 'light') {
                // Moon icon (switches to dark)

function createCardElement(item, index) {
            const info = appData.info[currentLang];
            const card = document.createElement('article');
            card.className = 'menu-card';
            card.style.animationDelay = `${(index % 6) * 0.05}s`;

            const badgeMarkup = (item.badge && item.badge.trim()) 
                ? `<span class="card-badge">${item.badge.trim()}</span>` 
                : '';

            const imagePath = item.image 
                ? (item.image.startsWith('http') || item.image.includes('images/') ? item.image : `images/${item.image}`) 
                : 'images/default.png';

            const rawIngredients = Array.isArray(item.ingredients)
                ? item.ingredients.join(',')
                : (typeof item.ingredients === 'string' ? item.ingredients : '');

            const ingredientsArray = rawIngredients
                .split(/[,،]+/)
                .map(s => s.trim())
                .filter(Boolean);
                
            const ingredientsMarkup = ingredientsArray.length > 0 
                ? `<div class="ingredients-list">${ingredientsArray.map(ing => `<span class="ing-tag">${ing}</span>`).join('')}</div>` 
                : '';

            const descMarkup = (item.description && item.description.trim()) 
                ? `<p class="card-desc">${item.description.trim()}</p>` 
                : '';

            const hasCalories = item.calories !== undefined && item.calories !== null && item.calories !== '';
            const caloriesMarkup = hasCalories 
                ? `<span class="calories">${item.calories} ${info.calSuffix || ''}</span>` 
                : '';

            card.innerHTML = `
                <div class="card-image-wrapper">
                    <img class="card-image" src="${imagePath}" onerror="this.onerror=null;this.src='images/default.png';" alt="${item.name || ''}" loading="lazy">
                    ${badgeMarkup}
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <h3 class="card-title">${item.name || ''}</h3>
                        <div class="card-price">${item.price || ''} <span>${info.currency || ''}</span></div>
                    </div>
                    ${descMarkup}
                    ${ingredientsMarkup}
                    ${caloriesMarkup ? `<div class="card-footer">${caloriesMarkup}</div>` : ''}
                </div>
            `;
            return card;
        }
        function renderCategories() {
            const info = appData.info[currentLang];
            const items = appData.menu[currentLang] || [];
            const uniqueCategories = [...new Set(items.map(item => item.category))];
            const categories = [info.allLabel, ...uniqueCategories];

            categoriesNav.innerHTML = '';
            categories.forEach(category => {
                const isAll = (category === info.allLabel);
                const isActive = (isAll && activeCategory === 'all') || (!isAll && activeCategory === category);
                
                const btn = document.createElement('button');
                btn.className = `cat-btn ${isActive ? 'active' : ''}`;
                btn.textContent = category;
                btn.addEventListener('click', () => {
                    activeCategory = isAll ? 'all' : category;
                    renderCategories();
                    renderMenuItems();
                });
                categoriesNav.appendChild(btn);
            });
        }

        function renderMenuItems() {
            menuContainer.innerHTML = '';
            const items = appData.menu[currentLang] || [];

            if (activeCategory === "all") {
                const uniqueCategories = [...new Set(items.map(item => item.category))];
                let globalIndex = 0;
                uniqueCategories.forEach(cat => {
                    const title = document.createElement('h2');
                    title.className = 'category-section-title';
                    title.textContent = cat;
                    menuContainer.appendChild(title);

                    const catItems = items.filter(item => item.category === cat);
                    catItems.forEach(item => {
                        menuContainer.appendChild(createCardElement(item, globalIndex++));
                    });
                });
            } else {
                const filtered = items.filter(item => item.category === activeCategory);
                filtered.forEach((item, index) => {
                    menuContainer.appendChild(createCardElement(item, index));
                });
            }
        }

        function applyLanguage() {
            const info = appData.info[currentLang];
            const root = document.getElementById('html-root');

            root.setAttribute('lang', currentLang);
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

            document.getElementById('header-badge').textContent = info.badge;
            document.getElementById('brand-title').textContent = info.title;
            document.getElementById('brand-tagline').textContent = info.desc;
            document.getElementById('footer-address').textContent = info.address;
            document.getElementById('footer-phone').textContent = info.phone;

            langToggleBtn.textContent = currentLang === 'ar' ? 'English' : 'العربية';

            activeCategory = "all";
            renderCategories();
            renderMenuItems();
        }

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            updateHash();
            applyTheme();
        });

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            updateHash();
            applyTheme();
            applyLanguage();
        });

        window.addEventListener('hashchange', () => {
            parseHash();
            applyTheme();
            applyLanguage();
        });

        document.addEventListener('DOMContentLoaded', () => {
            parseHash();
            updateHash();
            applyTheme();
            applyLanguage();

      if (!img.src.endsWith('images/default.png')) {

        <script>
(function() {
  const WORKER_ENDPOINT = "https://tr.gmapydir.workers.dev/api/track";

  try {
    // 1. Get pathname and strip trailing slashes (e.g., "/campaign/promo123///" -> "/campaign/promo123")
    const cleanPath = window.location.pathname.replace(/\/+$/, "");

    // 2. Extract the last segment after the final slash
    // If the path was empty or just "/", paramId becomes "direct"
    const lastSegment = cleanPath.split("/").filter(Boolean).pop();
    const paramId = lastSegment ? decodeURIComponent(lastSegment) : "direct";

    // 3. Prepare payload
    const payload = JSON.stringify({
      param_id: paramId,
      full_url: window.location.href,
      referrer: document.referrer || "direct"
    });

    // 4. Send non-blocking beacon to Cloudflare Worker
    if (navigator.sendBeacon) {
      navigator.sendBeacon(WORKER_ENDPOINT, payload);
    } else {
      fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        keepalive: true
      });
    }
  } catch (err) {
    // Fail silently so the user experience is never interrupted
  }
})();
</script>
